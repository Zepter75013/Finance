server {
    listen 80;
    server_name _;

    # Nginx refuse par défaut tout corps de requête au-delà de 1 Mo — trop
    # petit pour l'upload d'un rapport PDF généré côté client. Alignée sur la
    # limite déjà en place côté backend Go (30 Mo).
    client_max_body_size 30M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le frontend est buildé avec VITE_API_BASE_URL=/api : le navigateur
    # appelle toujours la même origine que la page, et nginx renvoie la
    # requête vers le backend en interne (pas de CORS cross-origin côté
    # navigateur, pas besoin d'exposer le backend publiquement).
    #
    # On cible "finance-backend" (le container_name, unique dans tout Docker)
    # plutôt que "backend" (le nom du service compose) : ce dernier est aussi
    # utilisé par l'app disques sur ce même réseau partagé, et Docker fait du
    # DNS round-robin entre les deux conteneurs qui répondent au nom "backend"
    # — une requête sur deux atterrissait donc chez le mauvais backend.
    location /api/ {
        proxy_pass http://finance-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
